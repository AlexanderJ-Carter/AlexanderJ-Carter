name: Profile CI

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - SECURITY.md
      - GOVERNANCE.md
      - .github/**
      - .markdownlint.json
  pull_request:
    branches:
      - main
    paths:
      - README.md
      - SECURITY.md
      - GOVERNANCE.md
      - .github/**
      - .markdownlint.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            SECURITY.md
            GOVERNANCE.md
            .github/**/*.md

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@v1.7.12
